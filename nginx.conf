# Reverse proxy MountyHall : mh2.nas.percolouco.com -> games.mountyhall.com
# Ajoute /_mhx/custom.css et /_mhx/custom.js dans chaque page HTML (surcouche perso).
# MH redirige les mobiles vers smartphone.mountyhall.com d'après le User-Agent :
# on présente un User-Agent « bureau » à MH quand le client est mobile/tablette.
map $http_user_agent $mh_user_agent {
    ~*(iphone|ipad|ipod|android|mobile|tablet) "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36";
    default $http_user_agent;
}

# Badge du proxy (voir mh_gate.js) : numéro du troll connecté via le proxy, "" sinon
js_set $mhx_troll mh_gate.badgeTroll;
js_set $mhx_api_key mh_gate.apiKey;
js_set $mhx_cookie_mh mh_gate.cookieMh;
js_var $mhx_login;

# Pages accessibles sans badge : accueil, connexion, mot de passe perdu, déconnexion, et les fichiers statiques
map $uri $mhx_libre {
    default 0;
    ~^/$ 1;
    ~^/mountyhall/?$ 1;
    ~^/mountyhall/index\.php$ 1;
    ~^/mountyhall/MH_Play/PlayStart2\.php$ 1;
    ~^/mountyhall/MH_Play/ChangeEmail\.php$ 1;
    ~^/mountyhall/LostPwd\.php$ 1;
    ~^/mountyhall/Logout\.php$ 1;
    ~*\.(css|js|png|gif|jpe?g|ico|svg|webp|woff2?|ttf|eot|map)$ 1;
}
map "$mhx_libre:$mhx_troll" $mhx_refuse {
    ~^1: 0;
    ~^0:$ 1;
    default 0;
}

# DNS interne de Docker uniquement (plus de repli sur 8.8.8.8)
resolver 127.0.0.11 valid=300s ipv6=off;

server {
    listen 80;
    server_name _;
    # Redirections relatives (le proxy est derrière Traefik en HTTPS)
    absolute_redirect off;

    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Surcouche perso (fichiers du dossier custom/)
    location /_mhx/ {
        alias /usr/share/nginx/custom/;
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        default_type text/plain;
        types { text/css css; application/javascript js; image/jpeg jpg jpeg; image/png png; }
    }

    # Relais vers le site mh (mh.percolouco.com) pour la surcouche : réservé aux porteurs d'un badge valide.
    # Le numéro du troll vient du badge (X-MHX-Troll), la clé MHX_API_KEY prouve au site que l'appel vient du proxy.
    # Seuls les scripts utilisés par custom.js sont relayés ; les cookies MH ne sont jamais transmis au site.
    location ~ ^/_mhx/api/((?:notif|gowap)/[a-z_]+\.php|evenements/api\.php|enchantements/includes/update/sync-commandes\.php|mission/includes/update/update_mission\.php|tactique/includes/sp_mh/parser_handler\.php)$ {
        if ($mhx_troll = "") { return 401; }
        set $mhx_cible $1;
        set $mhx_site mh;
        proxy_pass http://$mhx_site/$mhx_cible$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host mh.percolouco.com;
        proxy_set_header Cookie "";
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-MHX-Key $mhx_api_key;
        proxy_set_header X-MHX-Troll $mhx_troll;
        client_max_body_size 4m;
        proxy_read_timeout 120s;
    }
    location /_mhx/api/ { return 404; }

    # Aucune URL de type « fichier.php/suite » : elle permettait d'atteindre PlayStart2.php sans passer par la porte
    location ~ \.php/ { return 403; }

    # Page de connexion (et toutes ses variantes d'URL) : le formulaire POST est contrôlé côté serveur (mh_gate.js)
    # avant d'être transmis à MH. Seuls les trolls de la liste peuvent tenter de se connecter ; les autres sont bloqués (403).
    # Le corps de la requête (mot de passe) n'est ni journalisé ni stocké.
    location ^~ /mountyhall/MH_Play/PlayStart2.php {
        client_body_buffer_size 64k;
        client_max_body_size 64k;
        js_content mh_gate.login;
    }

    # Déconnexion MH : le badge du proxy est retiré aussi
    location = /mountyhall/Logout.php {
        add_header Set-Cookie "mhx_badge=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax" always;
        include /etc/nginx/mh_proxy.inc;
    }

    location @mh {
        js_header_filter mh_gate.badgeFilter;
        include /etc/nginx/mh_proxy.inc;
    }

    # Toutes les autres pages du jeu : badge obligatoire, sinon retour à la page de connexion
    location / {
        if ($mhx_refuse) { return 302 /mountyhall/MH_Play/PlayStart2.php; }
        include /etc/nginx/mh_proxy.inc;
    }
}
