# Reverse proxy MountyHall : mh2.nas.percolouco.com -> games.mountyhall.com
# Ajoute /_mhx/custom.css et /_mhx/custom.js dans chaque page HTML (surcouche perso).
# MH redirige les mobiles vers smartphone.mountyhall.com d'après le User-Agent :
# on présente un User-Agent « bureau » à MH quand le client est mobile/tablette.
map $http_user_agent $mh_user_agent {
    ~*(iphone|ipad|ipod|android|mobile|tablet) "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36";
    default $http_user_agent;
}

resolver 127.0.0.11 8.8.8.8 valid=300s ipv6=off;

server {
    listen 80;
    server_name _;

    # Surcouche perso (fichiers du dossier custom/)
    location /_mhx/ {
        alias /usr/share/nginx/custom/;
        add_header Cache-Control "no-cache";
        default_type text/plain;
        types { text/css css; application/javascript js; image/jpeg jpg jpeg; image/png png; }
    }

    # Page de connexion : le formulaire POST est controle cote serveur (mh_gate.js) avant d'etre transmis a MH.
    # Seuls les trolls de la liste peuvent tenter de se connecter ; les autres sont bloques (403).
    # Le corps de la requete (mot de passe) n'est ni journalise ni stocke.
    location = /mountyhall/MH_Play/PlayStart2.php {
        client_body_buffer_size 64k;
        client_max_body_size 64k;
        js_content mh_gate.login;
    }

    location @mh {
        include /etc/nginx/mh_proxy.inc;
    }

    location / {
        include /etc/nginx/mh_proxy.inc;
    }
}
