services:
  mh-proxy:
    image: nginx:1.27-alpine
    container_name: mh-proxy
    restart: unless-stopped
    volumes:
      - /home/perco/projects/mh-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/perco/projects/mh-proxy/custom:/usr/share/nginx/custom:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mh-proxy.rule=Host(`mh2.nas.percolouco.com`)"
      - "traefik.http.routers.mh-proxy.entrypoints=websecure"
      - "traefik.http.routers.mh-proxy.tls=true"
      - "traefik.http.routers.mh-proxy.tls.certresolver=letsencrypt"
      - "traefik.http.services.mh-proxy.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
